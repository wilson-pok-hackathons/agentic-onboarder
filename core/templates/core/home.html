<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Django Posts</title>
</head>
<body>
    <h1>My posts</h1>

    {% for post in posts %}
        <article>
            <h2>{{ post.first_name }}</h2>
            <p>{{ post.last_name }}</p>
        </article>
    {% empty %}
        <p>No posts yet.</p>
    {% endfor %}
</body>
</html>
