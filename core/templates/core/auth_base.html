{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Relay{% endblock %} · Agentic onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/app.css' %}">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <a class="brand auth-brand" href="{% url 'login' %}">
      <span class="brand-mark auth-brand-mark">R</span>
      <span>Relay Scholar</span>
    </a>

    {% if messages %}
      {% for message in messages %}
        <div class="flash {{ message.tags }}" style="max-width: 420px; margin: 0 auto 15px;">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
