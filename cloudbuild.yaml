steps:
  # Pull the previous successful image for Docker layer caching.
  # The first cached build may not have a latest image yet, so failure is allowed.
  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - |
        docker pull \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:latest \
          || exit 0

  # Build once and reuse unchanged layers from the previous image.
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:latest
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  # Run checks and tests inside the image instead of installing dependencies again.
  - name: gcr.io/cloud-builders/docker
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        docker run --rm \
          -e DJANGO_SECRET_KEY=cloud-build-test-key \
          -e DATABASE_URL=sqlite:////tmp/build-test.sqlite3 \
          -e DEBUG=False \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA \
          sh -c "python manage.py check && python manage.py test"

  # Push the immutable commit image used for deployment.
  - name: gcr.io/cloud-builders/docker
    id: push-commit
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  # Update the cache source only after checks and tests pass.
  - name: gcr.io/cloud-builders/docker
    id: push-cache
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:latest

  # Create/update the migration job and execute it.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_SERVICE_NAME}-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUD_SQL_CONNECTION}
      - --set-secrets=DJANGO_SECRET_KEY=${_DJANGO_SECRET}:${_SECRET_VERSION},DATABASE_URL=${_DATABASE_SECRET}:${_SECRET_VERSION}
      - --set-env-vars=DEBUG=False,DJANGO_ALLOWED_HOSTS=*,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=True,WORKFLOW_STATE_BACKEND=django,AGENT_BACKEND=local
      - --command=python
      - --args=manage.py,migrate
      - --execute-now
      - --wait

  # Deploy the web application.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUD_SQL_CONNECTION}
      - --set-secrets=DJANGO_SECRET_KEY=${_DJANGO_SECRET}:${_SECRET_VERSION},DATABASE_URL=${_DATABASE_SECRET}:${_SECRET_VERSION}
      - --set-env-vars=DEBUG=False,DJANGO_ALLOWED_HOSTS=*,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=True,WORKFLOW_STATE_BACKEND=django,AGENT_BACKEND=local

options:
  logging: CLOUD_LOGGING_ONLY